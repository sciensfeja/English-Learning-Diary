<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs</title>
    <style>
        :root {
            --bg-gray: #F8F9FA;
            --card-gray: #FFFFFF;
            --text-main: #333333;
            --text-secondary: #666666;
            --pink-light: #FCE4EC;
            --pink-accent: #F48FB1;
            --purple-light: #F3E5F5;
            --purple-accent: #BA68C8;
            --border-color: #E0E0E0;
            --success: #4CAF50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-gray);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--purple-accent);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-btn {
            background-color: var(--purple-light);
            color: var(--purple-accent);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid var(--purple-accent);
        }

        .back-btn:hover {
            background-color: var(--purple-accent);
            color: white;
        }

        main {
            flex: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
        }

        .stats-bar {
            background: linear-gradient(135deg, var(--purple-light) 0%, var(--pink-light) 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--purple-accent);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .controls-bar {
            background: var(--card-gray);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--bg-gray);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--purple-accent);
            background: white;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--bg-gray);
            color: var(--text-secondary);
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--pink-accent);
            color: var(--pink-accent);
        }

        .filter-btn.active {
            background-color: var(--pink-accent);
            color: white;
            border-color: var(--pink-accent);
        }

        .verbs-container {
            background: var(--card-gray);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .verbs-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .verbs-table th {
            background-color: var(--purple-accent);
            color: white;
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .verbs-table th:first-child {
            border-radius: 8px 0 0 0;
        }

        .verbs-table th:last-child {
            border-radius: 0 8px 0 0;
        }

        .verbs-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .verbs-table tr {
            transition: background 0.2s;
        }

        .verbs-table tbody tr:hover {
            background-color: var(--pink-light);
        }

        .verbs-table tr.learned {
            background-color: #E8F5E9;
        }

        .verbs-table tr.learned:hover {
            background-color: #C8E6C9;
        }

        .verb-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .verb-text {
            font-weight: 500;
            color: var(--text-main);
        }

        .translation-cell {
            color: var(--text-secondary);
            font-style: italic;
        }

        .speak-btn {
            background: white;
            border: 1px solid var(--border-color);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .speak-btn:hover {
            background-color: var(--pink-accent);
            color: white;
            border-color: var(--pink-accent);
            transform: scale(1.1);
        }

        .learn-btn {
            background: white;
            border: 2px solid var(--border-color);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .learn-btn:hover {
            border-color: var(--success);
            color: var(--success);
        }

        .learn-btn.active {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .reset-btn {
            background-color: var(--pink-accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background-color: var(--purple-accent);
        }

        .letter-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .letter-btn {
            background: var(--bg-gray);
            border: 1px solid var(--border-color);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: var(--purple-accent);
            transition: all 0.2s;
        }

        .letter-btn:hover {
            background-color: var(--purple-accent);
            color: white;
            border-color: var(--purple-accent);
        }

        @media (max-width: 768px) {
            .verbs-table {
                font-size: 0.9rem;
            }

            .verbs-table th,
            .verbs-table td {
                padding: 10px 8px;
            }

            .speak-btn {
                width: 26px;
                height: 26px;
                font-size: 0.8rem;
            }

            .learn-btn {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>

    <header>

            <div class="letter-nav" id="letterNav"></div>

            <div class="filter-bar">

                <tbody id="verbsTableBody"></tbody>

            <div class="no-results" id="noResults" style="display: none;">
                <h3>No verbs found</h3>
                <p>Try a different search term</p>
            </div>
        </div>
    </main>

            { v1: "sew", v2: "sewed", v3: "sewn", translation: "шить" },
            { v1: "shrink", v2: "shrank", v3: "shrunk", translation: "сжиматься" },
            { v1: "sink", v2: "sank", v3: "sunk", translation: "тонуть" },
            { v1: "slay", v2: "slew", v3: "slain", translation: "убивать" },
            { v1: "sow", v2: "sowed", v3: "sown", translation: "сеять" },
            { v1: "strive", v2: "strove", v3: "striven", translation: "стремиться" },
            { v1: "swell", v2: "swelled", v3: "swollen", translation: "опухать" },
            { v1: "weave", v2: "wove", v3: "woven", translation: "ткать" },
            { v1: "wed", v2: "wed/wedded", v3: "wed/wedded", translation: "жениться" },
            { v1: "weep", v2: "wept", v3: "wept", translation: "плакать" },
            { v1: "wind", v2: "wound", v3: "wound", translation: "заводить, наматывать" },
            { v1: "withhold", v2: "withheld", v3: "withheld", translation: "удерживать" }
        ];

        // Убираем дубликаты
        const uniqueVerbs = [];
        const seen = new Set();
        irregularVerbs.forEach(verb => {
            if (!seen.has(verb.v1)) {
                seen.add(verb.v1);
                uniqueVerbs.push(verb);
            }
        });

        let learnedVerbs = JSON.parse(localStorage.getItem('learnedVerbs')) || [];
        let currentFilter = 'all';
        let currentSearch = '';
        let currentLetter = '';

        function init() {
            updateStats();
            renderLetterNav();
            renderTable();
            setupEventListeners();
        }

        function updateStats() {
            document.getElementById('totalVerbs').textContent = uniqueVerbs.length;
            document.getElementById('learnedVerbs').textContent = learnedVerbs.length;
            document.getElementById('remainingVerbs').textContent = uniqueVerbs.length - learnedVerbs.length;
        }

        function renderLetterNav() {
            const letters = [...new Set(uniqueVerbs.map(v => v.v1[0].toUpperCase()))].sort();
            const nav = document.getElementById('letterNav');
            nav.innerHTML = '<button class="letter-btn" data-letter="" style="width: auto; padding: 0 12px;">All</button>';
            letters.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.dataset.letter = letter;
                nav.appendChild(btn);
            });
        }

        function getFilteredVerbs() {
            let filtered = [...uniqueVerbs];

            // Фильтр по статусу
            if (currentFilter === 'learned') {
                filtered = filtered.filter(v => learnedVerbs.includes(v.v1));
            } else if (currentFilter === 'new') {
                filtered = filtered.filter(v => !learnedVerbs.includes(v.v1));
            }

            // Фильтр по букве
            if (currentLetter) {
                filtered = filtered.filter(v => v.v1.toLowerCase().startsWith(currentLetter.toLowerCase()));
            }

            // Поиск
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                filtered = filtered.filter(v =>
                    v.v1.toLowerCase().includes(search) ||
                    v.v2.toLowerCase().includes(search) ||
                    v.v3.toLowerCase().includes(search) ||
                    v.translation.toLowerCase().includes(search)
                );
            }

            return filtered;
        }

        function renderTable() {
            const tbody = document.getElementById('verbsTableBody');
            const noResults = document.getElementById('noResults');
            const filtered = getFilteredVerbs();

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            tbody.innerHTML = '';

            filtered.forEach(verb => {
                const isLearned = learnedVerbs.includes(verb.v1);
                const tr = document.createElement('tr');
                if (isLearned) tr.classList.add('learned');

                tr.innerHTML = `
                    <td>
                        <button class="learn-btn ${isLearned ? 'active' : ''}" 
                                onclick="toggleLearned('${verb.v1}')" 
                                title="${isLearned ? 'Unmark' : 'Mark as learned'}">
                            ${isLearned ? '✓' : '○'}
                        </button>
                    </td>
                    <td>
                        <div class="verb-cell">
                            <button class="speak-btn" onclick="speakWord('${verb.v1}')">🔊</button>
                            <span class="verb-text">${verb.v1}</span>
                        </div>
                    </td>
                    <td>
                        <div class="verb-cell">
                            <button class="speak-btn" onclick="speakWord('${verb.v2.replace(/'/g, "\\'")}')">🔊</button>
                            <span class="verb-text">${verb.v2}</span>
                        </div>
                    </td>
                    <td>
                        <div class="verb-cell">
                            <button class="speak-btn" onclick="speakWord('${verb.v3.replace(/'/g, "\\'")}')">🔊</button>
                            <span class="verb-text">${verb.v3}</span>
                        </div>
                    </td>
                    <td class="translation-cell">${verb.translation}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleLearned(verb) {
            const index = learnedVerbs.indexOf(verb);
            if (index > -1) {
                learnedVerbs.splice(index, 1);
            } else {
                learnedVerbs.push(verb);
            }
            localStorage.setItem('learnedVerbs', JSON.stringify(learnedVerbs));
            updateStats();
            renderTable();
        }

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            } else {
                alert('Speech synthesis is not supported in your browser');
            }
        }

        function speakAllVisible() {
            const filtered = getFilteredVerbs();
            if (filtered.length === 0) return;

            if (!confirm(`Speak all ${filtered.length} verbs? This may take a while.`)) return;

            speechSynthesis.cancel();
            let index = 0;

            function speakNext() {
                if (index >= filtered.length) return;
                const verb = filtered[index];
                const text = `${verb.v1}, ${verb.v2}, ${verb.v3}`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                utterance.onend = () => {
                    index++;
                    setTimeout(speakNext, 500);
                };
                speechSynthesis.speak(utterance);
            }

            speakNext();
        }

        function setupEventListeners() {
            // Поиск
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearch = e.target.value;
                renderTable();
            });

            // Фильтры
            document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTable();
                });
            });

            // Буквы
            document.getElementById('letterNav').addEventListener('click', (e) => {
                if (e.target.classList.contains('letter-btn')) {
                    document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentLetter = e.target.dataset.letter;
                    renderTable();
                }
            });
        }

        init();
    </script>
</body>
</html>
