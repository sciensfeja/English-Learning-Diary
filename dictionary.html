<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Dictionary</title>
    <style>
        :root {
            --bg-gray: #F8F9FA;
            --card-gray: #FFFFFF;
            --text-main: #333333;
            --text-secondary: #666666;
            --pink-light: #FCE4EC;
            --pink-accent: #F48FB1;
            --purple-light: #F3E5F5;
            --purple-accent: #BA68C8;
            --border-color: #E0E0E0;
            --success: #4CAF50;
            --error: #F44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-gray);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--purple-accent);
        }

        .back-btn {
            background-color: var(--purple-light);
            color: var(--purple-accent);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid var(--purple-accent);
        }

        .back-btn:hover {
            background-color: var(--purple-accent);
            color: white;
        }

        main {
            flex: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
        }

        .stats-bar {
            background: linear-gradient(135deg, var(--purple-light) 0%, var(--pink-light) 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--purple-accent);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--card-gray);
            color: var(--text-secondary);
            padding: 12px 24px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        .tab-btn:hover {
            border-color: var(--purple-accent);
            color: var(--purple-accent);
        }

        .tab-btn.active {
            background-color: var(--purple-accent);
            color: white;
            border-color: var(--purple-accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* All Words Tab */
        .words-container {
            background: var(--card-gray);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--bg-gray);
            color: var(--text-secondary);
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--pink-accent);
            color: var(--pink-accent);
        }

        .filter-btn.active {
            background-color: var(--pink-accent);
            color: white;
            border-color: var(--pink-accent);
        }

        .words-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .word-card {
            background-color: var(--purple-light);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--purple-accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .word-card:hover {
            background-color: var(--pink-light);
            border-left-color: var(--pink-accent);
            transform: translateX(3px);
        }

        .word-card.learned {
            background-color: #E8F5E9;
            border-left-color: var(--success);
            opacity: 0.7;
        }

        .word-info {
            flex: 1;
        }

        .word-english {
            font-weight: 600;
            color: var(--purple-accent);
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .word-translation {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .word-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: white;
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.2rem;
        }

        .icon-btn:hover {
            background-color: var(--purple-accent);
            color: white;
            border-color: var(--purple-accent);
        }

        .icon-btn.speak-btn:hover {
            background-color: var(--pink-accent);
            border-color: var(--pink-accent);
        }

        .icon-btn.learned-btn {
            color: var(--success);
        }

        .icon-btn.learned-btn:hover {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }

        /* Study Tab */
        .study-container {
            background: var(--card-gray);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .study-card {
            background: linear-gradient(135deg, var(--purple-light) 0%, var(--pink-light) 100%);
            padding: 60px 40px;
            border-radius: 12px;
            margin-bottom: 30px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .study-word {
            font-size: 3rem;
            font-weight: bold;
            color: var(--purple-accent);
            margin-bottom: 20px;
        }

        .study-translation {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-top: 20px;
            min-height: 40px;
        }

        .study-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .study-btn {
            background-color: var(--purple-accent);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .study-btn:hover {
            background-color: var(--pink-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 143, 177, 0.4);
        }

        .study-btn.secondary {
            background-color: var(--bg-gray);
            color: var(--purple-accent);
            border: 2px solid var(--purple-accent);
        }

        .study-btn.secondary:hover {
            background-color: var(--purple-light);
        }

        .study-btn.success {
            background-color: var(--success);
        }

        .study-btn.success:hover {
            background-color: #45a049;
        }

        /* Test Tab */
        .test-container {
            background: var(--card-gray);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .test-question {
            background: linear-gradient(135deg, var(--purple-light) 0%, var(--pink-light) 100%);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .test-word {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--purple-accent);
            margin-bottom: 15px;
        }

        .test-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .test-option {
            background-color: var(--bg-gray);
            border: 2px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .test-option:hover:not(.disabled) {
            border-color: var(--purple-accent);
            background-color: var(--purple-light);
            transform: translateY(-2px);
        }

        .test-option.correct {
            background-color: #E8F5E9;
            border-color: var(--success);
            color: var(--success);
            font-weight: 600;
        }

        .test-option.incorrect {
            background-color: #FFEBEE;
            border-color: var(--error);
            color: var(--error);
        }

        .test-option.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .test-feedback {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .test-feedback.correct {
            background-color: #E8F5E9;
            color: var(--success);
        }

        .test-feedback.incorrect {
            background-color: #FFEBEE;
            color: var(--error);
        }

        .no-words-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-words-message h3 {
            color: var(--purple-accent);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .reset-btn {
            background-color: var(--pink-accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background-color: var(--purple-accent);
        }

        @media (max-width: 768px) {
            .study-word {
                font-size: 2rem;
            }

            .test-word {
                font-size: 1.8rem;
            }

            .test-options {
                grid-template-columns: 1fr;
            }

            .words-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Vocabulary Dictionary</h1>
        <a href="index.html" class="back-btn">← Back to Diary</a>

    <main>
        <!-- Статистика -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number" id="totalWords">0</div>
                <div class="stat-label">Total Words</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="learnedWords">0</div>
                <div class="stat-label">Learned</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="remainingWords">0</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>

        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="all">📖 All Words</button>
            <button class="tab-btn" data-tab="study">🎓 Study</button>
            <button class="tab-btn" data-tab="test">✍️ Test</button>
            <button class="tab-btn" onclick="window.location.href='irregular-verbs.html'">📋 Irregular Verbs</button>
        </div>

        <!-- Вкладка: Все слова -->
        <div class="tab-content active" id="all-tab">
            <div class="words-container">
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="new">New</button>
                    <button class="filter-btn" data-filter="learned">Learned</button>
                </div>
                <div class="words-list" id="wordsList"></div>
            </div>
        </div>

        <!-- Вкладка: Изучение -->
        <div class="tab-content" id="study-tab">
            <div class="study-container" id="studyContainer">
                <div class="study-card">
                    <div class="study-word" id="studyWord">Loading...</div>
                    <button class="icon-btn speak-btn" onclick="speakWord(document.getElementById('studyWord').textContent)" style="margin: 20px auto;">🔊</button>
                    <div class="study-translation" id="studyTranslation"></div>
                </div>
                <div class="study-controls">
                    <button class="study-btn secondary" onclick="showTranslation()">Show Translation</button>
                    <button class="study-btn success" onclick="markAsLearned()">✓ Mark as Learned</button>
                    <button class="study-btn" onclick="nextStudyWord()">Next Word →</button>
                </div>
            </div>
        </div>

        <!-- Вкладка: Тест -->
        <div class="tab-content" id="test-tab">
            <div class="test-container" id="testContainer">
                <div class="test-question">
                    <div class="test-word" id="testWord">Loading...</div>
                    <button class="icon-btn speak-btn" onclick="speakWord(document.getElementById('testWord').textContent)" style="margin: 15px auto;">🔊</button>
                </div>
                <div class="test-options" id="testOptions"></div>
                <div class="test-feedback" id="testFeedback" style="display: none;"></div>
                <button class="study-btn" id="nextTestBtn" onclick="nextTestQuestion()" style="display: none;">Next Question →</button>
            </div>
        </div>
    </main>

        // Загрузка выученных слов из localStorage
        let learnedWords = JSON.parse(localStorage.getItem('learnedWords')) || [];
        let currentStudyWord = null;
        let currentTestWord = null;
        let testOptions = [];
        let currentFilter = 'all';

        // Инициализация
        function init() {
            updateStats();
            renderWordsList();
            loadStudyWord();
            loadTestQuestion();
            setupEventListeners();
        }

        // Обновление статистики
        function updateStats() {
            document.getElementById('totalWords').textContent = vocabulary.length;
            document.getElementById('learnedWords').textContent = learnedWords.length;
            document.getElementById('remainingWords').textContent = vocabulary.length - learnedWords.length;
        }

        // Рендер списка слов
        function renderWordsList() {
            const wordsList = document.getElementById('wordsList');
            wordsList.innerHTML = '';

            let filteredWords = vocabulary;
            if (currentFilter === 'learned') {
                filteredWords = vocabulary.filter(w => learnedWords.includes(w.word));
            } else if (currentFilter === 'new') {
                filteredWords = vocabulary.filter(w => !learnedWords.includes(w.word));
            }

            filteredWords.forEach(wordObj => {
                const isLearned = learnedWords.includes(wordObj.word);
                const card = document.createElement('div');
                card.className = `word-card ${isLearned ? 'learned' : ''}`;
                card.innerHTML = `
                    <div class="word-info">
                        <div class="word-english">${wordObj.word}</div>
                        <div class="word-translation">${wordObj.translation}</div>
                    </div>
                    <div class="word-actions">
                        <button class="icon-btn speak-btn" onclick="speakWord('${wordObj.word.replace(/'/g, "\\'")}')">🔊</button>
                        <button class="icon-btn learned-btn" onclick="toggleLearned('${wordObj.word.replace(/'/g, "\\'")}')" title="${isLearned ? 'Unmark' : 'Mark as learned'}">
                            ${isLearned ? '✓' : '○'}
                        </button>
                    </div>
                `;
                wordsList.appendChild(card);
            });
        }

        // Переключение статуса "выучено"
        function toggleLearned(word) {
            const index = learnedWords.indexOf(word);
            if (index > -1) {
                learnedWords.splice(index, 1);
            } else {
                learnedWords.push(word);
            }
            localStorage.setItem('learnedWords', JSON.stringify(learnedWords));
            updateStats();
            renderWordsList();
        }

        // Озвучивание слова
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            } else {
                alert('Sorry, your browser does not support speech synthesis');
            }
        }

        // Загрузка слова для изучения
        function loadStudyWord() {
            const remaining = vocabulary.filter(w => !learnedWords.includes(w.word));
            if (remaining.length === 0) {
                document.getElementById('studyContainer').innerHTML = `
                    <div class="no-words-message">
                        <h3>🎉 Congratulations!</h3>
                        <p>You've learned all the words!</p>
                        <button class="reset-btn" onclick="resetProgress()">Reset Progress</button>
                    </div>
                `;
                return;
            }

            const randomIndex = Math.floor(Math.random() * remaining.length);
            currentStudyWord = remaining[randomIndex];
            
            document.getElementById('studyWord').textContent = currentStudyWord.word;
            document.getElementById('studyTranslation').textContent = '';
        }

        // Показать перевод
        function showTranslation() {
            if (currentStudyWord) {
                document.getElementById('studyTranslation').textContent = currentStudyWord.translation;
            }
        }

        // Отметить как выученное
        function markAsLearned() {
            if (currentStudyWord && !learnedWords.includes(currentStudyWord.word)) {
                learnedWords.push(currentStudyWord.word);
                localStorage.setItem('learnedWords', JSON.stringify(learnedWords));
                updateStats();
                renderWordsList();
            }
            nextStudyWord();
        }

        // Следующее слово для изучения
        function nextStudyWord() {
            loadStudyWord();
        }

        // Загрузка вопроса для теста
        function loadTestQuestion() {
            const remaining = vocabulary.filter(w => !learnedWords.includes(w.word));
            if (remaining.length === 0) {
                document.getElementById('testContainer').innerHTML = `
                    <div class="no-words-message">
                        <h3>🎉 Congratulations!</h3>
                        <p>You've learned all the words!</p>
                        <button class="reset-btn" onclick="resetProgress()">Reset Progress</button>
                    </div>
                `;
                return;
            }

            const randomIndex = Math.floor(Math.random() * remaining.length);
            currentTestWord = remaining[randomIndex];
            
            document.getElementById('testWord').textContent = currentTestWord.word;
            
            // Генерация вариантов ответа
            const wrongOptions = vocabulary
                .filter(w => w.word !== currentTestWord.word)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(w => w.translation);
            
            testOptions = [currentTestWord.translation, ...wrongOptions].sort(() => Math.random() - 0.5);
            
            const optionsContainer = document.getElementById('testOptions');
            optionsContainer.innerHTML = '';
            testOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'test-option';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('testFeedback').style.display = 'none';
            document.getElementById('nextTestBtn').style.display = 'none';
        }

        // Проверка ответа
        function checkAnswer(selected, btn) {
            const options = document.querySelectorAll('.test-option');
            options.forEach(opt => {
                opt.classList.add('disabled');
                if (opt.textContent === currentTestWord.translation) {
                    opt.classList.add('correct');
                }
            });

            const feedback = document.getElementById('testFeedback');
            if (selected === currentTestWord.translation) {
                btn.classList.add('correct');
                feedback.className = 'test-feedback correct';
                feedback.textContent = '✓ Correct!';
            } else {
                btn.classList.add('incorrect');
                feedback.className = 'test-feedback incorrect';
                feedback.textContent = `✗ Incorrect. The correct answer is: ${currentTestWord.translation}`;
            }
            feedback.style.display = 'block';
            document.getElementById('nextTestBtn').style.display = 'inline-block';
        }

        // Следующий вопрос
        function nextTestQuestion() {
            loadTestQuestion();
        }

        // Сброс прогресса
        function resetProgress() {
            if (confirm('Are you sure you want to reset all progress?')) {
                learnedWords = [];
                localStorage.setItem('learnedWords', JSON.stringify(learnedWords));
                location.reload();
            }
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            // Вкладки
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
                });
            });

            // Фильтры
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderWordsList();
                });
            });
        }

        // Запуск
        init();
    </script>
